<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福田小測驗 - 專業清晰版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f7f3f0;
            line-height: 1.6;
        }
        .form-paper {
            background-color: #ffffff;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 30px 30px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15);
            border: 1px solid #d1d5db;
            position: relative;
        }
        .form-paper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #b91c1c;
            border-radius: 12px 12px 0 0;
        }
        .input-underline {
            border-bottom: 2px solid #9ca3af;
            border-radius: 0;
            transition: all 0.3s ease;
            font-size: 1.25rem;
            padding: 8px 4px;
        }
        .input-underline:focus {
            border-bottom: 3px solid #b91c1c;
            background-color: #fffaf0;
            outline: none;
        }
        .label-style {
            color: #1f2937;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
            font-size: 1.5rem;
        }
        .case-card {
            border-left: 10px solid #b91c1c;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 10px;
        }
        .warning-text {
            font-weight: 900;
            font-size: 1.1rem;
            margin-top: 4px;
            display: none;
        }
        .warning-red { color: #ef4444; }
        .warning-orange { color: #d97706; }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 md:p-10">

    <div id="app" class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 sm:mb-14">
            <h1 class="text-4xl sm:text-5xl font-black text-gray-900 tracking-tight mb-4">
                福田<span class="text-red-700">小測驗</span>
            </h1>
            <div class="h-1.5 w-24 bg-red-700 mx-auto rounded-full mb-4"></div>
            <p class="text-xl text-gray-600 font-bold italic">精進執事專業 · 法喜充滿</p>
        </header>

        <!-- Main Content Area -->
        <main id="quiz-container" class="space-y-8 sm:space-y-12">
            <!-- Content will be injected here -->
        </main>

        <!-- Feedback Modal -->
        <div id="feedback-modal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-3xl shadow-2xl max-w-xl w-full overflow-hidden transform transition-all">
                <div class="bg-gray-100 px-8 py-5 border-b border-gray-200 flex justify-between items-center">
                    <h2 id="feedback-title" class="text-2xl font-black text-gray-800"></h2>
                    <span class="text-sm font-black text-white bg-red-700 px-3 py-1.5 rounded-lg">正確範本</span>
                </div>
                <div id="feedback-content" class="p-6 sm:p-10 custom-scroll overflow-y-auto max-h-[75vh]">
                    <!-- Answer details will be injected here -->
                </div>
                <div class="p-6 bg-gray-100 border-t border-gray-200">
                    <button onclick="closeModal()" class="w-full bg-red-700 text-white py-4 rounded-2xl font-black text-2xl hover:bg-red-800 transition-colors shadow-lg">
                        我已確認，下一題
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cases = [
            {
                id: 1,
                title: "實務案例 1",
                desc: "夜研二艾布施居士發心：(1)中台藥師法會如意 10000 (2)供養三寶3000。收據以母親尤慈心名義開立，收據編號FN114101200091。",
                answer: {
                    name: "艾布施/夜研二",
                    amount: "13000 #0091",
                    remarks: "中台藥師-如意 10000\n供養三寶3000",
                    title: "尤慈心/母",
                    contact: "",
                    address: "",
                    handler: "XXX",
                    date: "10/15"
                }
            },
            {
                id: 2,
                title: "實務案例 2",
                desc: "夜中班艾布施居士發心：(1)地藏永久牌位 40000 (2)地藏作七 2000。收據開以父親艾發心名義開立，收據編號FN114101200066。",
                answer: {
                    name: "艾布施/夜中班",
                    amount: "42000 #0066",
                    remarks: "地藏永久牌位 40000\n地藏平日牌位2000",
                    title: "艾發心/父(開2000)",
                    contact: "",
                    address: "",
                    handler: "XXX",
                    date: "10/15"
                }
            },
            {
                id: 3,
                title: "實務案例 3",
                desc: "日初班艾布施居士發心：(1)金剛法會 10000 隨喜牌位。不開收據。",
                answer: {
                    name: "艾布施/日初班",
                    amount: "10000",
                    remarks: "金剛寶懺-隨牌",
                    title: "X",
                    contact: "",
                    address: "",
                    handler: "XXX",
                    date: "10/15"
                }
            },
            {
                id: 4,
                title: "實務案例 4",
                desc: "夜研二艾布施居士發心：(1)三昧水懺吉祥50000 (2)三昧水懺打齋5000 (3)收據開公司「福田有限公司」。本身是公司負責人同修，收據號0051。",
                answer: {
                    name: "艾布施/夜研二",
                    amount: "55000 #0051",
                    remarks: "三昧水懺-吉祥 50000\n三昧水懺-打齋 5000",
                    title: "福田有限公司(負責人同修)",
                    contact: "",
                    address: "",
                    handler: "XXX",
                    date: "10/15"
                }
            },
            {
                id: 5,
                title: "實務案例 5",
                desc: "日初李小明的朋友(非學員)艾布施居士發心：(1)供養三寶 600。不開收據。",
                answer: {
                    name: "艾布施",
                    amount: "600",
                    remarks: "供養三寶",
                    title: "X",
                    contact: "日初/李小明",
                    address: "",
                    handler: "XXX",
                    date: "10/15"
                }
            }
        ];

        const tfQuestions = [
            { id: 1, text: "地藏永久牌位不開立收據，但天祥永久牌位可以。", explanation: "皆不開立" },
            { id: 2, text: "學員來發心永久牌位，只要收功德金、填寫小單即可。", explanation: "需另外填寫資料表" },
            { id: 3, text: "當收據已開立，需填寫右下角收據填號在福田小單。", explanation: "應填寫收據之「右上角」編號" },
            { id: 4, text: "學員不需要收據，可鼓勵他開收據抵稅。", explanation: "尊重個人意願，不應勉強" }
        ];

        let currentStep = 0; 

        function render() {
            const container = document.getElementById('quiz-container');
            
            if (currentStep < 5) {
                const c = cases[currentStep];
                container.innerHTML = `
                    <div class="case-card p-6 sm:p-8 rounded-r-2xl">
                        <div class="flex items-center gap-4 mb-4">
                            <span class="bg-red-700 text-white text-base sm:text-lg font-black px-4 py-1.5 rounded-full uppercase">案例 ${c.id}</span>
                            <h3 class="font-black text-gray-900 text-2xl sm:text-3xl">${c.title}</h3>
                        </div>
                        <p class="text-gray-800 text-xl sm:text-2xl leading-relaxed font-medium bg-gray-50 p-4 rounded-xl border border-gray-100">${c.desc}</p>
                    </div>

                    <div class="form-paper rounded-3xl p-6 sm:p-12 md:p-14">
                        <div class="text-center mb-10">
                            <h4 class="text-2xl font-black text-gray-400 border-b-4 border-dotted border-gray-100 pb-3 inline-block px-6 tracking-widest">福田小單模擬填寫</h4>
                        </div>
                        
                        <div class="space-y-8 max-w-xl mx-auto">
                            <!-- 姓名欄位 -->
                            <div class="flex flex-col">
                                <div class="flex items-baseline gap-4">
                                    <label class="label-style w-24 sm:w-28 shrink-0 text-2xl">姓　名：</label>
                                    <input type="text" id="q_name" class="input-underline grow text-2xl font-bold bg-transparent" placeholder="姓名/班別">
                                </div>
                                <div id="q_name-warning" class="warning-text ml-24 sm:ml-28"></div>
                            </div>
                            
                            <!-- 金額欄位 -->
                            <div class="flex flex-col">
                                <div class="flex items-baseline gap-4">
                                    <label class="label-style w-24 sm:w-28 shrink-0 text-2xl">金　額：</label>
                                    <input type="text" id="q_amount" class="input-underline grow text-2xl font-bold bg-transparent" placeholder="總額 #末四碼">
                                </div>
                                <div id="q_amount-warning" class="warning-text ml-24 sm:ml-28"></div>
                            </div>
                            
                            <!-- 備註欄位 -->
                            <div class="flex flex-col gap-3">
                                <label class="label-style text-2xl">備　註：</label>
                                <textarea id="q_remarks" rows="3" class="w-full p-4 border-2 border-gray-200 rounded-2xl text-2xl font-bold focus:outline-none focus:ring-4 focus:ring-red-100 transition-all bg-white" placeholder="詳細列出明細..."></textarea>
                                <div id="q_remarks-warning" class="warning-text"></div>
                            </div>
                            
                            <!-- 抬頭欄位 -->
                            <div class="flex flex-col">
                                <div class="flex items-baseline gap-4">
                                    <label class="label-style w-24 sm:w-28 shrink-0 text-2xl">抬　頭：</label>
                                    <input type="text" id="q_title" class="input-underline grow text-2xl font-bold bg-transparent" placeholder="收據開立名義">
                                </div>
                                <div id="q_title-warning" class="warning-text ml-24 sm:ml-28"></div>
                            </div>

                            <div class="flex items-baseline gap-4">
                                <label class="label-style w-24 sm:w-28 shrink-0 text-2xl">聯絡人：</label>
                                <input type="text" id="q_contact" class="input-underline grow text-2xl font-bold bg-transparent">
                            </div>

                            <div class="flex items-baseline gap-4">
                                <label class="label-style w-24 sm:w-28 shrink-0 text-2xl">地　址：</label>
                                <input type="text" id="q_address" class="input-underline grow text-2xl font-bold bg-transparent">
                            </div>

                            <!-- 底部欄位 -->
                            <div class="pt-8 border-t-2 border-gray-100 space-y-6 sm:space-y-0 sm:flex sm:gap-10">
                                <div class="flex flex-col sm:w-1/2">
                                    <div class="flex items-baseline gap-4">
                                        <label class="label-style shrink-0 text-xl">經手人：</label>
                                        <input type="text" id="q_handler" class="input-underline grow text-xl font-bold bg-transparent">
                                    </div>
                                    <div id="q_handler-warning" class="warning-text"></div>
                                </div>
                                <div class="flex flex-col sm:w-1/2">
                                    <div class="flex items-baseline gap-4">
                                        <label class="label-style shrink-0 text-xl">日　期：</label>
                                        <input type="text" id="q_date" class="input-underline grow text-xl font-bold bg-transparent" placeholder="MM/DD">
                                    </div>
                                    <div id="q_date-warning" class="warning-text"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col items-center gap-6 pt-6">
                        <button onclick="checkCase()" class="btn-primary w-full max-w-lg text-white font-black py-5 rounded-3xl shadow-2xl hover:opacity-90 active:scale-95 transition-all">
                            提交並查看範本
                        </button>
                        <div class="flex gap-3">
                            ${[0, 1, 2, 3, 4].map(i => `<div class="h-2 w-10 sm:w-12 rounded-full ${i <= currentStep ? 'bg-red-700' : 'bg-gray-200'} shadow-sm"></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (currentStep === 5) {
                renderTFSection(container);
            } else {
                renderFinishSection(container);
            }
        }

        function normalize(str) {
            return str.replace(/\s+/g, '').toLowerCase();
        }

        function checkCase() {
            const current = cases[currentStep];
            const checkFields = [
                { id: 'q_name', label: '姓名', ans: current.answer.name },
                { id: 'q_amount', label: '金額', ans: current.answer.amount },
                { id: 'q_remarks', label: '備註', ans: current.answer.remarks },
                { id: 'q_title', label: '抬頭', ans: current.answer.title },
                { id: 'q_handler', label: '經手人', ans: current.answer.handler },
                { id: 'q_date', label: '日期', ans: current.answer.date }
            ];

            let hasEmptyError = false;
            let firstErrorElement = null;

            checkFields.forEach(f => {
                const input = document.getElementById(f.id);
                const warning = document.getElementById(f.id + '-warning');
                const val = input.value.trim();
                const ans = f.ans.trim();

                if (!val) {
                    warning.innerHTML = `⚠️ ${f.label}不可空白，請務必填寫`;
                    warning.classList.add('warning-red');
                    warning.classList.remove('warning-orange');
                    warning.style.display = 'block';
                    hasEmptyError = true;
                    if (!firstErrorElement) firstErrorElement = input;
                } else if (normalize(val) !== normalize(ans)) {
                    warning.innerHTML = `💡 請檢查${f.label}內容是否與範本完全一致`;
                    warning.classList.add('warning-orange');
                    warning.classList.remove('warning-red');
                    warning.style.display = 'block';
                } else {
                    warning.style.display = 'none';
                }
            });

            if (hasEmptyError) {
                firstErrorElement.focus();
                return; 
            }

            // 全部填寫後顯示範本彈窗
            showModal("填寫範本對照", `
                <div class="bg-white border-4 border-red-50 rounded-3xl p-8 relative shadow-inner">
                    <div class="absolute -top-4 -right-4 bg-red-700 text-white text-sm px-4 py-1.5 rounded-full shadow-lg font-black">標準範本</div>
                    <div class="space-y-6">
                        <div class="flex border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold w-20 shrink-0">姓名</span>
                            <span class="font-black text-blue-900 text-2xl">${current.answer.name}</span>
                        </div>
                        <div class="flex border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold w-20 shrink-0">金額</span>
                            <span class="font-black text-red-700 text-2xl underline decoration-red-200">${current.answer.amount}</span>
                        </div>
                        <div class="flex flex-col border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold mb-2">備註項目</span>
                            <span class="text-blue-900 text-2xl font-black leading-relaxed whitespace-pre-line">${current.answer.remarks}</span>
                        </div>
                        <div class="flex border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold w-20 shrink-0">抬頭</span>
                            <span class="font-black text-gray-800 text-2xl">${current.answer.title}</span>
                        </div>
                        <div class="flex border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold w-20 shrink-0">聯絡人</span>
                            <span class="font-black text-gray-800 text-2xl">${current.answer.contact || '（無資料）'}</span>
                        </div>
                        <div class="flex border-b-2 border-gray-100 pb-3">
                            <span class="text-gray-400 text-base font-bold w-20 shrink-0">地址</span>
                            <span class="font-black text-gray-800 text-2xl">${current.answer.address || '（無資料）'}</span>
                        </div>
                        <div class="flex justify-between items-end pt-6 opacity-80">
                            <span class="text-lg font-bold text-gray-500">經手：${current.answer.handler}</span>
                            <span class="text-lg font-bold text-gray-500">日期：${current.answer.date}</span>
                        </div>
                    </div>
                </div>
                <div class="mt-8 bg-amber-50 p-6 rounded-2xl border-2 border-amber-100 shadow-sm">
                    <p class="text-amber-900 text-xl font-bold leading-relaxed">
                        <span class="font-black text-2xl mr-2">💡 核對要點：</span><br>
                        請務必確認捐款人資料正確、金額與點收一致、功德項目、經手人均要填寫正確無誤。
                    </p>
                </div>
            `);
        }

        function renderTFSection(container) {
            container.innerHTML = `
                <div class="bg-white rounded-3xl p-8 sm:p-12 shadow-xl mb-8 border-2 border-red-50">
                    <h3 class="text-3xl sm:text-4xl font-black text-gray-800 text-center mb-12 flex items-center justify-center gap-4">
                        <span class="w-12 h-12 rounded-full bg-red-100 text-red-700 text-2xl flex items-center justify-center italic font-black shadow-inner">?</span>
                        福田知見是非題
                    </h3>
                    <div class="space-y-12">
                        ${tfQuestions.map(q => `
                            <div class="relative pl-12 border-b-2 border-gray-50 pb-8 last:border-0">
                                <span class="absolute left-0 top-0 text-3xl font-black text-gray-100">${q.id}</span>
                                <p class="text-gray-800 font-bold mb-6 leading-relaxed text-2xl sm:text-3xl">${q.text}</p>
                                <div class="flex gap-5">
                                    <button onclick="answerTF(${q.id}, true)" class="flex-1 py-4 border-4 border-gray-100 rounded-2xl hover:border-green-500 hover:text-green-700 font-black transition-all flex items-center justify-center gap-3 text-2xl text-nowrap">
                                        <span class="text-3xl">○</span> 正確
                                    </button>
                                    <button onclick="answerTF(${q.id}, false)" class="flex-1 py-4 border-4 border-gray-100 rounded-2xl hover:border-red-500 hover:text-red-700 font-black transition-all flex items-center justify-center gap-3 text-2xl text-nowrap">
                                        <span class="text-3xl">×</span> 錯誤
                                    </button>
                                </div>
                                <div id="tf-feedback-${q.id}" class="mt-6 p-6 rounded-2xl hidden transform transition-all scale-100 origin-top block shadow-md">
                                    <div id="tf-status-${q.id}" class="font-black flex items-center gap-3 mb-3 text-2xl"></div>
                                    <div class="text-gray-700 text-xl bg-white/80 p-4 rounded-xl shadow-inner border border-gray-100">
                                        <span class="font-black text-gray-900 text-2xl block mb-2 underline decoration-red-500 decoration-4">觀念指引：</span>
                                        ${q.explanation}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <button id="finish-btn" onclick="finishQuiz()" class="btn-primary w-full text-white font-black py-6 rounded-3xl shadow-2xl hidden animate-bounce text-3xl">
                    完成所有測驗
                </button>
            `;
        }

        function renderFinishSection(container) {
            container.innerHTML = `
                <div class="text-center py-24 bg-white rounded-[3rem] shadow-2xl border-4 border-green-50">
                    <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-8 shadow-lg">
                        <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-4xl sm:text-5xl font-black text-gray-900 mb-6">法喜充滿！練習完成</h2>
                    <p class="text-gray-600 max-w-md mx-auto mb-14 text-2xl font-bold leading-relaxed">隨喜大眾發心功德，願此執事練習增長您的智慧與定力。</p>
                    <button onclick="location.reload()" class="bg-gray-900 text-white px-16 py-6 rounded-[2rem] font-black text-3xl hover:bg-black transition-all shadow-2xl active:scale-95">
                        再次練習
                    </button>
                </div>
            `;
        }

        function answerTF(id, userChoice) {
            const feedbackEl = document.getElementById(`tf-feedback-${id}`);
            const statusEl = document.getElementById(`tf-status-${id}`);
            feedbackEl.classList.remove('hidden');
            
            if (userChoice === false) {
                statusEl.innerHTML = `<svg class="w-8 h-8 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l5-5z" clip-rule="evenodd"></path></svg> 正確！此描述為錯誤。`;
                feedbackEl.className = "mt-6 p-6 rounded-2xl bg-green-50 border-2 border-green-200 transform transition-all scale-100 origin-top block shadow-md";
                statusEl.className = "font-black text-green-700 flex items-center gap-3 mb-3 text-2xl";
            } else {
                statusEl.innerHTML = `<svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg> 觀念有誤！請參考下方正確解答。`;
                feedbackEl.className = "mt-6 p-6 rounded-2xl bg-red-50 border-2 border-red-200 transform transition-all scale-100 origin-top block shadow-md";
                statusEl.className = "font-black text-red-700 flex items-center gap-3 mb-3 text-2xl";
            }

            const answeredCount = document.querySelectorAll('[id^="tf-feedback-"]:not(.hidden)').length;
            if (answeredCount === 4) {
                const btn = document.getElementById('finish-btn');
                btn.classList.remove('hidden');
                btn.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function showModal(title, content) {
            document.getElementById('feedback-title').innerText = title;
            document.getElementById('feedback-content').innerHTML = content;
            document.getElementById('feedback-modal').classList.remove('hidden');
            const modalBox = document.querySelector('#feedback-modal > div');
            modalBox.classList.add('scale-100', 'opacity-100');
            modalBox.classList.remove('scale-95', 'opacity-0');
        }

        function closeModal() {
            const modalBox = document.querySelector('#feedback-modal > div');
            modalBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('feedback-modal').classList.add('hidden');
                currentStep++;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 150);
        }

        function finishQuiz() {
            currentStep++;
            render();
        }

        render();
    </script>
</body>
</html>
