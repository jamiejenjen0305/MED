<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>覺知森林：八大人覺修行之旅</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 圖標庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap');
        
        body {
            margin: 0;
            background-color: #020617;
            font-family: 'Noto Serif TC', serif;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* 防止手機拉動重新整理 */
            overscroll-behavior-y: contain;
        }

        /* 使用 translate3d 觸發硬體加速 */
        @keyframes firefly { 
            0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.1; } 
            50% { transform: translate3d(20px, -30px, 0); opacity: 0.25; } 
        }
        @keyframes float-island { 
            0%, 100% { transform: translate3d(0, 0, 0); } 
            50% { transform: translate3d(0, -6px, 0); } 
        }
        @keyframes spin-slow { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        /* 畫面震動效果 */
        @keyframes shake-screen {
            0%, 100% { transform: translate3d(0, 0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate3d(-6px, 0, 0); }
            20%, 40%, 60%, 80% { transform: translate3d(6px, 0, 0); }
        }
        @keyframes star-float {
            0% { transform: translate3d(0, 0, 0); }
            25% { transform: translate3d(30px, -40px, 0); }
            50% { transform: translate3d(-20px, 30px, 0); }
            75% { transform: translate3d(-40px, -15px, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .animate-firefly { animation: firefly 12s ease-in-out infinite; will-change: transform, opacity; }
        .animate-float-island { animation: float-island 6s ease-in-out infinite; will-change: transform; }
        .animate-spin-slow { animation: spin-slow 25s linear infinite; }
        .animate-shake-screen { animation: shake-screen 0.4s cubic-bezier(.36,.07,.19,.97) both; will-change: transform; }
        .animate-star-float { animation: star-float 15s ease-in-out infinite; will-change: transform; }
        .animate-twinkle { animation: twinkle var(--duration) ease-in-out infinite; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .text-shadow-md {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* 優化按鈕觸控 */
        .level-card {
            transition: transform 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67), filter 0.2s ease;
            user-select: none;
        }
        .level-card:active {
            transform: scale(0.94) !important;
            filter: brightness(1.1);
        }

        @media (max-width: 640px) {
            .blur-xl { filter: blur(12px); }
            .shadow-2xl { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo, memo } = React;

        const SCRIPTURE_INTRO = "為佛弟子，常於晝夜，至心誦念，八大人覺。";

        // 圓滿覺知五段式分段
        const SCRIPTURE_EPILOGUE_GROUPS = [
            { id: "e1", phrases: ["如此八事", "乃是諸佛", "菩薩大人", "之所覺悟"], full: "如此八事，乃是諸佛菩薩大人之所覺悟。" },
            { id: "e2", phrases: ["精進行道", "慈悲修慧", "乘法身船", "至涅槃岸", "復還生死", "度脫眾生"], full: "精進行道，慈悲修慧，乘法身船，至涅槃岸，復還生死，度脫眾生。" },
            { id: "e3", phrases: ["以前八事", "開導一切", "令諸眾生", "覺生死苦", "捨離五欲", "修心聖道"], full: "以前八事，開導一切，令諸眾生，覺生死苦，捨離五欲，修心聖道。" },
            { id: "e4", phrases: ["若佛弟子", "誦此八事", "於念念中", "滅無量罪"], full: "若佛弟子，誦此八事，於念念中，滅無量罪。" },
            { id: "e5", phrases: ["進趣菩提", "速登正覺", "永斷生死", "常住快樂"], full: "進趣菩提，速登正覺；永斷生死，常住快樂。" }
        ];

        const SCRIPTURE_OUTRO = `如此八事，乃是諸佛菩薩大人之所覺悟，精進行道，慈悲修慧，乘法身船，至涅槃岸，復還生死，度脫眾生。以前八事，開導一切，令諸眾生，覺生死苦，捨離五欲，修心聖道。若佛弟子，誦此八事，於念念中，滅無量罪，進趣菩提，速登正覺；永斷生死，常住快樂。`;

        const LEVELS = [
            { id: 1, title: "第一覺悟", subtitle: "無常覺", image: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=400", scripture: ["第一覺悟", "世間無常", "國土危脆", "四大苦空", "五陰無我", "生滅變異", "虛偽無主", "心是惡源", "形為罪藪", "如是觀察", "漸離生死"], full: "第一覺悟，世間無常，國土危脆；四大苦空，五陰無我，生滅變異，虛偽無主；心是惡源，形為罪藪；如是觀察，漸離生死。", time: 100, bgm: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
            { id: 2, title: "第二覺知", subtitle: "多欲覺", image: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&q=80&w=400", scripture: ["第二覺知", "多欲為苦", "生死疲勞", "從貪欲起", "少欲無為", "身心自在"], full: "第二覺知，多欲為苦，生死疲勞，從貪欲起，少欲無為，身心自在。", time: 60, bgm: "https://jamiejenjen0305.github.io/MED/8-2.mp3" },
            { id: 3, title: "第三覺知", subtitle: "知足覺", image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&q=80&w=400", scripture: ["第三覺知", "心無厭足", "惟得多求", "增長罪惡", "菩薩不爾", "常念知足", "安貧守道", "惟慧是業"], full: "第三覺知，心無厭足，惟得多求，增長罪惡；菩薩不爾，常念知足，安貧守道，惟慧是業。", time: 80, bgm: "https://jamiejenjen0305.github.io/MED/8-3.mp3" },
            { id: 4, title: "第四覺知", subtitle: "精進覺", image: "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&q=80&w=400", scripture: ["第四覺知", "懈怠墜落", "常行精進", "破煩惱惡", "摧伏四魔", "出陰界獄"], full: "第四覺知，懈怠墜落；常行精進，破煩惱惡，摧伏四魔，出陰界獄。", time: 60, bgm: "https://jamiejenjen0305.github.io/MED/8-4.mp3" },
            { id: 5, title: "第五覺悟", subtitle: "智慧覺", image: "https://images.unsplash.com/photo-1507499739999-097706ad8914?auto=format&fit=crop&q=80&w=400", scripture: ["第五覺悟", "愚癡生死", "菩薩常念", "廣學多聞", "增長智慧", "成就辯才", "教化一切", "悉以大樂"], full: "第五覺悟，愚癡生死，菩薩常念，廣學多聞，增長智慧，成就辯才，教化一切，悉以大樂。", time: 80, bgm: "https://jamiejenjen0305.github.io/MED/8-5.mp3" },
            { id: 6, title: "第六覺知", subtitle: "布施覺", image: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&q=80&w=400", scripture: ["第六覺知", "貧苦多怨", "橫結惡緣", "菩薩布施", "等念怨親", "不念舊惡", "不憎惡人"], full: "第六覺知，貧苦多怨，橫結惡緣；菩薩布施，等念怨親，不念舊惡，不憎惡人。", time: 80, bgm: "https://jamiejenjen0305.github.io/MED/8-6.mp3" },
            { id: 7, title: "第七覺悟", subtitle: "梵行覺", image: "https://images.unsplash.com/photo-1518128958364-65859d70aa41?auto=format&fit=crop&q=80&w=400", scripture: ["第七覺悟", "五欲過患", "雖為俗人", "不染世樂", "常念三衣", "瓦缽法器", "志願出家", "守道清白", "梵行高遠", "慈悲一切"], full: "第七覺悟，五欲過患；雖為俗人，不染世樂，常念三衣, 瓦缽法器，志願出家，守道清白，梵行高遠，慈悲一切。", time: 120, bgm: "https://jamiejenjen0305.github.io/MED/8-7.mp3" },
            { id: 8, title: "第八覺知", subtitle: "大心覺", image: "https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&q=80&w=400", scripture: ["第八覺知", "生死熾然", "苦惱無量", "發大乘心", "普濟一切", "願代眾生", "受無量苦", "令諸眾生", "畢竟大樂"], full: "第八覺知，生死熾然，苦惱無量，發大乘心，普濟一切；願代眾生，受無量苦；令諸眾生，畢竟大樂。", time: 120, bgm: "https://jamiejenjen0305.github.io/MED/8-8.mp3" }
        ];

        const speakText = (text, onEnd) => {
            window.speechSynthesis.cancel();
            // 讀音校對邏輯
            const processedText = text
                .replace(/大樂/g, '大勒')
                .replace(/世樂/g, '世勒')
                .replace(/為得多求/g, '為德多求')
                .replace(/梵行高遠/g, '梵絎高遠')
                .replace(/發大乘心/g, '發大勝心')
                .replace(/覺生死苦/g, '絕生死苦')
                .replace(/多欲為苦/g, '多欲維苦')
                .replace(/少欲無為/g, '少欲無維')
                .replace(/進趣菩提/g, '進區菩提');
                
            const utterance = new SpeechSynthesisUtterance(processedText);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.8;
            utterance.pitch = 0.95;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('zh-TW')) || voices.find(v => v.lang.includes('zh'));
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.onend = () => { if (onEnd) onEnd(); };
            window.speechSynthesis.speak(utterance);
        };

        const Icon = memo(({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && lucide && lucide[name]) {
                    lucide.createIcons({
                        icons: { [name]: lucide[name] },
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);
            return <i ref={iconRef} data-lucide={name} className={className} style={{ display: 'inline-flex' }}></i>;
        });

        const StartScreen = ({ onStart }) => (
            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center animate-in fade-in zoom-in duration-1000">
                <div className="relative mb-6 sm:mb-12">
                    <div className="w-40 h-40 sm:w-64 sm:h-64 rounded-[3rem] overflow-hidden border-4 border-emerald-400/30 shadow-[0_0_80px_rgba(52,211,153,0.3)] bg-emerald-950/10 text-center">
                        <img src="https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=800" className="w-full h-full object-cover opacity-80" alt="新芽" />
                    </div>
                    <div className="absolute -top-3 -right-3 sm:-top-8 sm:-right-8 bg-emerald-500/10 backdrop-blur-3xl p-3 sm:p-6 rounded-full border border-white/20 animate-spin-slow text-emerald-300 text-center">
                        <Icon name="Sparkles" size={28} />
                    </div>
                </div>
                <h1 className="text-4xl sm:text-6xl lg:text-8xl font-black mb-4 sm:mb-8 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-emerald-200 via-emerald-400 to-teal-300">覺知小島</h1>
                <p className="text-base sm:text-xl lg:text-2xl text-slate-100 mb-6 sm:mb-8 font-light tracking-widest uppercase text-white text-center">聽，那是大地的低語</p>
                <div className="bg-white/10 backdrop-blur-md px-6 sm:px-10 py-3 sm:py-4 rounded-full border border-white/20 mb-8 sm:mb-14 animate-pulse mx-4">
                    <p className="text-emerald-300 text-xs sm:text-lg italic font-medium tracking-[0.2em]">{SCRIPTURE_INTRO}</p>
                </div>
                <button onClick={onStart} className="group bg-emerald-700 hover:bg-emerald-600 text-white px-10 sm:px-20 py-4 sm:py-7 rounded-full text-xl sm:text-3xl font-black shadow-2xl transition-all transform active:scale-90 flex items-center gap-4 text-white">
                    步入森林 <Icon name="ChevronRight" size={24} className="group-hover:translate-x-2 transition-transform text-white" />
                </button>
            </div>
        );

        const MapView = ({ levels, collectedIds, onSelect, onOpenJournal, onFinal, isDedicationDone }) => (
            <div className="flex-1 flex flex-col p-4 sm:p-14 overflow-y-auto custom-scrollbar animate-in fade-in duration-500">
                <header className="mb-6 sm:mb-10 flex flex-col sm:flex-row justify-between items-center gap-4 text-white text-center">
                    <div className="text-center sm:text-left text-white">
                        <div className="inline-block px-4 py-1 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/30 rounded-full text-[10px] sm:text-xs font-black text-emerald-300 mb-2 sm:mb-4 tracking-[0.3em] uppercase">修行之眼</div>
                        <h2 className="text-3xl sm:text-5xl lg:text-6xl font-black tracking-widest text-white text-shadow-md text-center">請選擇修行之島</h2>
                    </div>
                    <div className="flex gap-2 sm:gap-4 w-full sm:w-auto justify-center text-white">
                        <button onClick={onOpenJournal} className="flex-1 sm:flex-none group relative flex items-center justify-center gap-2 bg-emerald-950/60 px-4 sm:px-8 py-3 sm:py-5 rounded-2xl sm:rounded-[2.5rem] border border-emerald-500/40 transition-all active:scale-95 text-white">
                            <Icon name="BookOpen" size={20} className="text-emerald-400" />
                            <span className="text-sm sm:text-xl font-black text-emerald-100">智慧手札</span>
                            {isDedicationDone && <div className="absolute -bottom-1 -right-1 bg-amber-500 w-3 h-3 rounded-full animate-ping text-white" />}
                        </button>
                        {collectedIds.length === 8 && (
                           <button onClick={onFinal} className={`flex-1 sm:flex-none group relative flex items-center justify-center gap-2 px-4 sm:px-8 py-3 sm:py-5 rounded-2xl sm:rounded-[2.5rem] shadow-2xl transition-all active:scale-95 ${isDedicationDone ? 'bg-white/10 border border-amber-500/30 text-white' : 'bg-amber-600 hover:bg-amber-500 animate-pulse text-white'}`}>
                             <Icon name={isDedicationDone ? "Waves" : "Sparkles"} size={20} className={isDedicationDone ? "text-amber-400" : "text-white"} />
                             <span className={`text-sm sm:text-xl font-black ${isDedicationDone ? 'text-amber-200' : 'text-white'}`}>{isDedicationDone ? '重溫圓滿' : '圓滿覺知'}</span>
                           </button>
                        )}
                    </div>
                </header>
                <div className="flex-1 grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-10 mb-8 text-white text-center">
                    {levels.map((lvl, idx) => (
                        <button key={lvl.id} onClick={() => onSelect(idx)} className={`level-card relative group flex flex-col items-center p-4 sm:p-8 rounded-[2rem] sm:rounded-[3.5rem] border-2 transition-all ${collectedIds.includes(lvl.id) ? 'bg-emerald-950/40 border-emerald-500/60 shadow-lg backdrop-blur-sm' : 'bg-white/5 border-white/10'}`} style={{ animation: `float-island ${6 + idx * 0.5}s ease-in-out infinite` }}>
                            <div className="w-16 h-16 sm:w-32 sm:h-32 rounded-2xl sm:rounded-[2.5rem] overflow-hidden mb-3 sm:mb-6 relative border border-white/10 bg-black/20 text-center text-white">
                                <img src={lvl.image} className={`w-full h-full object-cover transition-opacity duration-700 ${collectedIds.includes(lvl.id) ? 'opacity-100 grayscale-0 scale-110' : 'opacity-40 grayscale'}`} alt={lvl.title} loading="lazy" />
                            </div>
                            <span className="text-[10px] sm:text-xs font-black text-emerald-300 mb-1 uppercase tracking-[0.1em]">{lvl.title}</span>
                            <h3 className="text-sm sm:text-xl font-black text-white drop-shadow-md">{lvl.subtitle}</h3>
                            {collectedIds.includes(lvl.id) && <div className="absolute -top-1.5 -right-1.5 bg-emerald-500 p-1 rounded-full text-white shadow-xl animate-pulse ring-2 ring-emerald-500/20 text-center"><Icon name="Sparkles" size={14} className="text-white" /></div>}
                        </button>
                    ))}
                </div>
            </div>
        );

        const GameEngine = ({ level, lives, setLives, onComplete, onBack, playEffect }) => {
            const [shuffled, setShuffled] = useState([]);
            const [selected, setSelected] = useState([]);
            const [timeLeft, setTimeLeft] = useState(level.time);
            const [isFinished, setIsFinished] = useState(false);
            const [isReading, setIsReading] = useState(false);
            const [showFailure, setShowFailure] = useState(false);
            const [shake, setShake] = useState(false);

            useEffect(() => {
                const arr = [...level.scripture].sort(() => Math.random() - 0.5);
                setShuffled(arr); setSelected([]); setTimeLeft(level.time); 
                setIsFinished(false); setShowFailure(false);
                return () => { window.speechSynthesis.cancel(); };
            }, [level]);

            useEffect(() => {
                if (timeLeft > 0 && !isFinished && !showFailure) {
                    const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearInterval(timer);
                } else if (timeLeft === 0 && !isFinished) {
                    setShowFailure(true);
                }
            }, [timeLeft, isFinished, showFailure]);

            const handlePhraseClick = (phrase) => {
                if (isFinished || isReading || showFailure) return;
                if (phrase === level.scripture[selected.length]) {
                    playEffect('correct');
                    const nextSelected = [...selected, phrase];
                    setSelected(nextSelected);
                    setShuffled(prev => prev.filter(p => p !== phrase));
                    if (nextSelected.length === level.scripture.length) {
                        setIsFinished(true); onComplete(); 
                        setIsReading(true); speakText(level.full, () => setIsReading(false));
                    }
                } else {
                    playEffect('wrong');
                    setShake(true); setTimeout(() => setShake(false), 400);
                    const nextLives = lives - 1; setLives(nextLives);
                    if (nextLives <= 0) setShowFailure(true);
                }
            };

            return (
                <div className={`flex-1 flex flex-col p-4 sm:p-10 animate-in fade-in duration-500 relative h-full overflow-hidden text-white text-center ${shake ? 'animate-shake-screen' : ''}`}>
                    <div className="flex justify-between items-center mb-6 px-2 sm:px-8 text-white text-center text-white">
                        <button onClick={onBack} className="bg-black/40 p-2 sm:px-6 sm:py-3 rounded-full border border-white/10 text-slate-300 hover:text-white transition-all flex items-center gap-1 text-white active:scale-90">
                            <Icon name="RefreshCw" size={16} className="rotate-180 text-white" /> <span className="text-sm sm:text-base text-white">退出</span>
                        </button>
                        <div className="flex items-center gap-3 sm:gap-12">
                            <div className="flex gap-1.5 sm:gap-3 text-white text-center">
                                {[...Array(3)].map((_, i) => (
                                    <div key={i} className={`transition-all duration-500 transform ${i < lives ? 'scale-100 opacity-100' : 'scale-50 opacity-20 rotate-45 grayscale'}`}>
                                        <Icon name="Leaf" size={24} className="text-emerald-400 fill-emerald-400/20 shadow-xl" />
                                    </div>
                                ))}
                            </div>
                            <div className={`flex items-center gap-2 bg-black/40 px-3 py-1.5 sm:px-6 sm:py-3 rounded-full border-2 border-white/20 shadow-2xl ${timeLeft < 10 ? 'animate-pulse text-red-500' : 'text-white'}`}>
                                <Icon name="Timer" size={18} /><span className="text-lg sm:text-3xl font-black tabular-nums">{timeLeft}s</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center gap-4 sm:gap-10 overflow-y-auto px-2 text-white text-center">
                        <div className="w-full max-w-4xl flex flex-wrap justify-center gap-2 sm:gap-4 min-h-[80px] bg-black/30 border border-white/10 p-4 sm:p-10 rounded-[2.5rem] shadow-xl text-center text-white">
                            {selected.map((p, i) => (
                                <div key={i} className="bg-emerald-600/80 text-white px-3 py-1.5 sm:px-8 sm:py-4 rounded-xl font-black text-sm sm:text-2xl animate-in zoom-in border border-emerald-400/50 shadow-lg text-center text-white">{p}</div>
                            ))}
                        </div>
                        {!isFinished && !showFailure && (
                            <div className="w-full max-w-4xl flex flex-wrap justify-center gap-2 sm:gap-6 pb-6 text-center text-white">
                                {shuffled.map((p, i) => (
                                    <button key={i} onClick={() => handlePhraseClick(p)} className="bg-black/60 hover:bg-emerald-900/60 active:scale-90 text-emerald-50 px-4 py-2 sm:px-8 sm:py-5 rounded-xl border border-white/10 font-black text-sm sm:text-2xl transition-all shadow-lg text-white">
                                        {p}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {isFinished && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/95 backdrop-blur-3xl z-50 animate-in fade-in duration-700 p-6 text-center text-white">
                            <div className="max-w-2xl text-center text-white">
                                <div className="w-20 h-20 sm:w-32 sm:h-32 bg-emerald-500/20 rounded-[2rem] flex items-center justify-center mb-6 border-2 sm:border-4 border-emerald-400 mx-auto shadow-2xl animate-float-island text-emerald-400">
                                    <Icon name={isReading ? "Volume2" : "Sparkles"} size={40} className={isReading ? "animate-pulse" : ""} />
                                </div>
                                <h2 className="text-3xl sm:text-5xl font-black text-emerald-300 mb-6 tracking-[0.4em] uppercase text-center text-white">修行覺醒</h2>
                                <div className="bg-white/5 p-6 sm:p-16 rounded-[2rem] border border-white/10 shadow-2xl mb-8 text-center text-white text-center">
                                   <p className="text-lg sm:text-4xl font-black text-white leading-relaxed italic text-center" style={{ fontFamily: 'Noto Serif TC' }}>「{level.full}」</p>
                                </div>
                                <button onClick={onBack} disabled={isReading} className={`bg-white text-slate-900 px-10 py-3 sm:px-20 sm:py-6 rounded-full font-black text-lg sm:text-3xl shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center gap-4 mx-auto text-slate-900 text-center ${isReading ? 'opacity-50 cursor-wait' : ''}`}>
                                    返回修行 <Icon name="ChevronRight" size={24} className="text-slate-900" />
                                </button>
                            </div>
                        </div>
                    )}
                    {showFailure && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-red-950/95 backdrop-blur-3xl z-50 animate-in fade-in p-6 text-center text-white text-center text-white">
                            <Icon name="AlertCircle" size={80} className="text-red-500 mb-4 animate-bounce text-white text-center text-white text-center" />
                            <h2 className="text-4xl sm:text-7xl font-black text-white mb-4 tracking-tighter text-center">心神已亂</h2>
                            <p className="text-lg sm:text-2xl text-red-200 mb-10 font-light text-center text-white">修行尚未穩固，請重新定心再試。</p>
                            <button onClick={onBack} className="bg-white text-slate-900 px-12 py-4 rounded-full font-black text-xl sm:text-3xl active:scale-95 shadow-2xl text-slate-900">重新定心</button>
                        </div>
                    )}
                </div>
            );
        };

        const DedicationScene = ({ onFinish, onBack, playEffect }) => {
            const [groupStep, setGroupStep] = useState(0); 
            const [interactionMode, setInteractionMode] = useState('memorize'); 
            const [correctSequence, setCorrectSequence] = useState([]);
            const [shuffledStars, setShuffledStars] = useState([]);
            const [isReading, setIsReading] = useState(false);
            const [errorStar, setErrorStar] = useState(null);
            const [shake, setShake] = useState(false);

            const bgFireflies = useMemo(() => {
                return [...Array(40)].map((_, i) => ({
                    id: i,
                    x: Math.random() * 100,
                    y: Math.random() * 100,
                    size: 1.5 + Math.random() * 3.5,
                    duration: 2 + Math.random() * 4 + "s",
                    delay: Math.random() * 5 + "s"
                }));
            }, []);

            const generateSafeStars = (group, isMobile) => {
                const stars = [];
                const minDistance = isMobile ? 22 : 18; 
                for (let i = 0; i < group.phrases.length; i++) {
                    let x, y, tooClose;
                    let attempts = 0;
                    do {
                        tooClose = false;
                        x = (isMobile ? 12 : 8) + Math.random() * (isMobile ? 70 : 82);
                        y = (isMobile ? 20 : 18) + Math.random() * (isMobile ? 55 : 62);
                        for (let j = 0; j < stars.length; j++) {
                            const dx = x - stars[j].x;
                            const dy = y - stars[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < minDistance) { tooClose = true; break; }
                        }
                        attempts++;
                    } while (tooClose && attempts < 40); 
                    stars.push({ id: i, text: group.phrases[i], x, y, delay: `${Math.random() * -15}s`, duration: `${11 + Math.random() * 8}s` });
                }
                return stars;
            };

            useEffect(() => {
                if (groupStep >= SCRIPTURE_EPILOGUE_GROUPS.length) return;
                const group = SCRIPTURE_EPILOGUE_GROUPS[groupStep];
                const isMobile = window.innerWidth < 640;
                const stars = generateSafeStars(group, isMobile);
                setShuffledStars([...stars].sort(() => Math.random() - 0.5));
                setCorrectSequence([]);
                setInteractionMode('memorize');
                const timer = setTimeout(() => setInteractionMode('link'), 3800);
                return () => clearTimeout(timer);
            }, [groupStep]);

            const handleStarClick = (star) => {
                if (interactionMode !== 'link' || isReading) return;
                const group = SCRIPTURE_EPILOGUE_GROUPS[groupStep];
                if (star.text === group.phrases[correctSequence.length]) {
                    playEffect('correct');
                    const newSequence = [...correctSequence, star.text];
                    setCorrectSequence(newSequence);
                    if (newSequence.length === group.phrases.length) {
                        setIsReading(true);
                        speakText(group.full, () => {
                            setIsReading(false);
                            if (groupStep < SCRIPTURE_EPILOGUE_GROUPS.length - 1) setGroupStep(groupStep + 1);
                            else { setInteractionMode('finished'); setTimeout(onFinish, 2000); }
                        });
                    }
                } else {
                    playEffect('wrong');
                    setErrorStar(star.id);
                    setShake(true); setTimeout(() => setShake(false), 400);
                    setTimeout(() => setErrorStar(null), 500);
                }
            };

            const currentGroup = SCRIPTURE_EPILOGUE_GROUPS[groupStep];

            return (
                <div className={`flex-1 flex flex-col items-center justify-center p-4 sm:p-20 animate-in fade-in duration-2000 relative text-white h-full overflow-hidden text-center text-white text-center ${shake ? 'animate-shake-screen' : ''}`}>
                    <div className="absolute inset-0 bg-gradient-to-br from-emerald-950/50 via-[#020617] to-amber-950/50 backdrop-blur-3xl pointer-events-none">
                        {bgFireflies.map(f => (
                            <div key={f.id} className="absolute rounded-full bg-amber-200 animate-twinkle shadow-[0_0_10px_rgba(251,191,36,0.8)]"
                                 style={{ left: `${f.x}%`, top: `${f.y}%`, width: `${f.size}px`, height: `${f.size}px`, '--duration': f.duration, animationDelay: f.delay }} 
                            />
                        ))}
                    </div>
                    
                    <div className="absolute top-6 left-6 z-50">
                         <button onClick={onBack} className="bg-white/10 hover:bg-white/20 p-3 sm:px-6 sm:py-3 rounded-full border border-white/20 text-white transition-all flex items-center gap-2 active:scale-90 text-white text-center">
                            <Icon name="X" size={20} className="text-white" /> <span className="hidden sm:inline">退出</span>
                        </button>
                    </div>

                    <div className="relative z-10 w-full h-full flex flex-col items-center">
                        <header className="mb-4 sm:mb-12">
                            <h2 className="text-3xl sm:text-5xl font-black text-amber-200 tracking-[0.3em] mb-2 uppercase text-shadow-md text-center text-white">圓滿覺知</h2>
                            <div className="inline-block px-6 sm:px-8 py-1.5 sm:py-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 backdrop-blur-md">
                                <p className="text-emerald-300 font-bold tracking-widest text-[11px] sm:text-lg">
                                    {interactionMode === 'memorize' ? "至心凝視 · 銘刻智慧" : isReading ? "法音流轉 · 覺性昇華" : "文字如螢 · 請依序點選"}
                                </p>
                            </div>
                        </header>
                        <div className="flex-1 w-full relative min-h-[300px] text-white">
                            {interactionMode === 'memorize' ? (
                                <div className="absolute inset-0 flex items-center justify-center animate-in fade-in zoom-in duration-1000 p-4 text-white text-center text-white">
                                    <div className="bg-black/40 p-6 sm:p-16 rounded-[2rem] sm:rounded-[4rem] border-2 border-amber-500/20 shadow-2xl backdrop-blur-xl text-center text-white">
                                        <p className="text-2xl sm:text-5xl font-black text-amber-100 leading-relaxed italic text-center" style={{ fontFamily: 'Noto Serif TC' }}>
                                            「{currentGroup.full}」
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full relative text-white text-center text-white">
                                    {shuffledStars.map((star) => {
                                        const isCorrect = correctSequence.includes(star.text);
                                        return (
                                            <div key={star.id} onClick={() => handleStarClick(star)} className={`absolute cursor-pointer transition-all duration-700 transform flex flex-col items-center group text-white text-center ${isCorrect ? 'scale-110 opacity-100' : 'hover:scale-125'} ${errorStar === star.id ? 'animate-shake' : ''} ${!isCorrect ? 'animate-star-float' : ''}`} style={{ left: `${star.x}%`, top: `${star.y}%`, animationDelay: star.delay, animationDuration: star.duration }}>
                                                <div className={`w-3 h-3 sm:w-5 sm:h-5 rounded-full mb-1.5 sm:mb-4 transition-all duration-500 text-white ${isCorrect ? 'bg-amber-400 shadow-[0_0_30px_rgba(251,191,36,1)] scale-150' : 'bg-white/40 group-hover:bg-white'}`}></div>
                                                <div className={`px-4 py-2 sm:px-8 sm:py-4 rounded-xl sm:rounded-[2.5rem] border transition-all duration-700 font-black text-lg sm:text-4xl backdrop-blur-md shadow-2xl text-white text-center ${isCorrect ? 'bg-amber-500/30 border-amber-400 text-amber-200' : 'bg-black/40 border-white/10 text-white group-hover:bg-black/60'}`}>{star.text}</div>
                                            </div>
                                        );
                                    })}
                                    {isReading && (
                                        <div className="absolute bottom-0 w-full animate-in slide-in-from-bottom duration-1000 p-4 text-white text-center text-white text-center">
                                            <div className="bg-emerald-950/60 px-6 py-6 sm:px-12 sm:py-10 rounded-2xl sm:rounded-[3rem] border-2 border-emerald-500/30 shadow-2xl backdrop-blur-xl text-white text-center text-white text-center">
                                                <p className="text-lg sm:text-3xl lg:text-4xl font-black text-white italic text-center drop-shadow-lg text-white">「{currentGroup.full}」</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        
                        {interactionMode === 'link' && !isReading && (
                            <div className="absolute bottom-10 w-full animate-pulse text-center">
                                <p className="text-amber-200/60 text-xs sm:text-sm tracking-[0.2em] text-white">請依序點選剛才出現的經文片語</p>
                            </div>
                        )}

                        <div className="mt-4 sm:mt-12 flex gap-4 text-white text-center">
                            {[0, 1, 2, 3, 4].map(i => (
                                <div key={i} className={`w-3 h-3 sm:w-4 sm:h-4 rounded-full border-2 border-white/20 transition-all duration-700 ${i < groupStep ? 'bg-emerald-400 border-emerald-400 shadow-lg' : i === groupStep ? 'bg-amber-400 border-amber-400 animate-pulse shadow-lg' : 'bg-white/5'}`} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const JournalView = ({ levels, collectedIds, onClose, isDedicationDone }) => (
            <div className="flex-1 flex flex-col p-6 sm:p-14 animate-in slide-in-from-right duration-700 overflow-hidden relative text-shadow-sm text-white h-full text-center text-white">
                <header className="mb-6 sm:mb-12 flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-white/20 pb-6 sm:pb-10 text-white text-center text-white">
                    <div className="text-center sm:text-left text-white text-white">
                        <h2 className="text-4xl sm:text-7xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 tracking-tighter text-white text-center text-white">智慧手札</h2>
                        <p className="text-slate-300 mt-2 font-bold tracking-[0.4em] uppercase text-[10px] sm:text-lg text-white text-center text-white">Treasury of Eight Realizations</p>
                    </div>
                    <button onClick={onClose} className="bg-black/50 hover:bg-black/70 px-8 py-2 sm:py-4 rounded-full border-2 border-white/20 font-black text-lg sm:text-2xl transition-all shadow-xl backdrop-blur-xl text-white active:scale-95 text-white">返回地圖</button>
                </header>
                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 sm:pr-8 space-y-6 pb-20 text-white text-center text-white text-center">
                    {collectedIds.length === 0 && !isDedicationDone ? (
                        <div className="h-full flex flex-col items-center justify-center text-slate-400 italic text-center">
                            <Icon name="ScrollText" size={80} className="mb-4 opacity-10 animate-pulse mx-auto text-white text-center text-white" />
                            <p className="text-xl sm:text-2xl tracking-[0.3em] text-white">手札空空，待您入林修行</p>
                        </div>
                    ) : (
                        <>
                            {levels.filter(l => collectedIds.includes(l.id)).map((level) => (
                                <div key={level.id} className="bg-black/40 p-5 sm:p-16 rounded-[2rem] border border-white/10 shadow-xl text-white text-center text-white text-center">
                                    <div className="flex items-center gap-4 sm:gap-10 mb-5 sm:mb-12 text-white text-left text-center">
                                        <div className="w-14 h-14 sm:w-28 sm:h-28 rounded-xl sm:rounded-3xl overflow-hidden border-2 border-amber-500/40 text-center text-white">
                                            <img src={level.image} className="w-full h-full object-cover" alt={level.title} />
                                        </div>
                                        <div className="text-left text-white text-center">
                                            <span className="text-[10px] sm:text-sm font-black text-amber-50 uppercase tracking-[0.1em] mb-1 block text-white">{level.title}</span>
                                            <h4 className="text-xl sm:text-5xl font-black text-white tracking-widest text-white text-center">{level.subtitle}</h4>
                                        </div>
                                    </div>
                                    <p className="text-base sm:text-4xl font-black text-emerald-50 leading-relaxed italic text-center text-white" style={{ fontFamily: 'Noto Serif TC' }}>「{level.full}」</p>
                                </div>
                            ))}
                            {isDedicationDone && (
                                <div className="bg-amber-950/40 p-5 sm:p-16 rounded-[2rem] border border-amber-500/30 shadow-xl mt-6 relative overflow-hidden text-center text-white text-center">
                                   <div className="flex items-center justify-center mb-5 text-white text-center text-white text-center">
                                     <div className="w-14 h-14 sm:w-28 sm:h-28 rounded-full bg-amber-600/20 flex items-center justify-center border-2 border-amber-400 text-white text-center mx-auto text-white">
                                       <Icon name="Waves" size={30} className="text-amber-400 text-center text-white" />
                                     </div>
                                   </div>
                                   <p className="text-base sm:text-4xl font-black text-amber-50 leading-relaxed italic text-center text-white" style={{ fontFamily: 'Noto Serif TC' }}>「{SCRIPTURE_OUTRO}」</p>
                                </div>
                            )}
                        </>
                    )}
                </div>
            </div>
        );

        const FinalResult = ({ levels, onRestart }) => (
            <div className="flex-1 flex flex-col p-4 sm:p-14 overflow-y-auto custom-scrollbar animate-in fade-in duration-2000 text-shadow-sm text-white h-full text-center text-white text-center text-white text-center">
                <header className="text-center mb-10 sm:mb-20 text-white text-center text-white text-center">
                    <div className="text-6xl sm:text-9xl mb-6 animate-float-island text-emerald-400 mx-auto flex justify-center text-white text-center text-white">🌳</div>
                    <h1 className="text-4xl sm:text-8xl lg:text-9xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-emerald-200 via-teal-100 to-blue-400 mb-4 text-white text-center text-white">八覺圓滿</h1>
                    <p className="text-sm sm:text-3xl lg:text-4xl text-slate-100 font-light tracking-[0.1em] max-w-4xl mx-auto px-4 leading-relaxed text-white text-center">善哉！覺知已成參天大樹，智慧永駐於心。</p>
                </header>
                <div className="max-w-6xl mx-auto space-y-10 mb-32 text-white text-center text-white text-center text-white">
                    <div className="bg-black/40 p-6 sm:p-20 rounded-[2.5rem] border border-emerald-500/30 text-center text-white text-center text-white text-center">
                        <h3 className="text-emerald-400 font-black mb-8 sm:mb-16 tracking-[0.5em] uppercase text-lg sm:text-2xl border-b border-emerald-500/20 pb-6 italic text-white text-center text-white">佛說八大人覺經 · 圓滿總覽</h3>
                        <div className="space-y-8 sm:space-y-20 text-white text-center text-white text-center">
                            {levels.map((lvl) => (
                                <div key={lvl.id} className="space-y-4 sm:space-y-8 px-2 sm:px-10 text-left text-center text-white text-center">
                                    <div className="flex items-center gap-4 sm:gap-8 text-white text-left text-center text-white text-center"><span className="w-8 h-8 sm:w-16 sm:h-16 rounded-full bg-emerald-500/20 flex items-center justify-center text-sm sm:text-2xl text-emerald-200 font-black border border-emerald-500/40 text-white text-center text-white">{lvl.id}</span><span className="text-xl sm:text-4xl font-black text-emerald-300 tracking-[0.1em] text-white text-center text-white">{lvl.subtitle}</span></div>
                                    <p className="text-lg sm:text-3xl font-bold text-white italic leading-relaxed pl-10 border-l-4 border-emerald-500/20 text-left text-white text-center text-white">「{lvl.full}」</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-black/50 p-6 sm:p-24 rounded-[2.5rem] border border-white/20 shadow-2xl backdrop-blur-xl text-white text-center text-white text-center">
                        <p className="text-lg sm:text-4xl text-white leading-relaxed md:leading-[2.4] font-light whitespace-pre-wrap italic text-white text-center text-white">「{SCRIPTURE_OUTRO}」</p>
                    </div>
                </div>
                <button onClick={onRestart} className="bg-white text-slate-900 px-10 py-4 sm:px-32 sm:py-10 rounded-full font-black text-xl sm:text-5xl shadow-2xl mx-auto flex items-center gap-6 active:scale-95 mb-32 text-slate-900 text-center text-slate-900 text-center text-slate-900">
                    <Icon name="RefreshCw" size={28} className="text-slate-900 text-center" /> 重新修心
                </button>
            </div>
        );

        function App() {
            const [view, setView] = useState('start');
            const [collectedIds, setCollectedIds] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [lives, setLives] = useState(3);
            const [isDedicationDone, setIsDedicationDone] = useState(false);
            const bgmRef = useRef(null);
            const audioContextRef = useRef(null);

            useEffect(() => {
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
            }, []);

            const playBgm = (url) => {
                if (bgmRef.current) bgmRef.current.pause();
                bgmRef.current = new Audio(url); 
                bgmRef.current.loop = true; 
                bgmRef.current.volume = 0.2;
                bgmRef.current.play().catch(() => {});
            };

            const playEffect = (type) => {
                const ctx = audioContextRef.current;
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110.00, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            };

            return (
                <div className="min-h-screen relative overflow-hidden flex items-center justify-center w-full text-white text-center">
                    <div className="absolute inset-0 z-0 text-center select-none pointer-events-none text-white text-center text-white text-center text-white text-center">
                        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1600" className="w-full h-full object-cover opacity-60 scale-105" alt="背景" />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/70 via-transparent to-black/80 text-white text-center text-white text-center text-white text-center"></div>
                        <div className="absolute inset-0 overflow-hidden text-white text-center text-white text-center text-white text-center text-white text-center">
                            {[...Array(10)].map((_, i) => (
                                <div key={i} className="absolute rounded-full bg-emerald-400/20 blur-xl animate-firefly text-white text-center text-white text-center text-white text-center text-white text-center"
                                    style={{ width: Math.random()*80+40+'px', height: Math.random()*80+40+'px', top: Math.random()*100+'%', left: Math.random()*100+'%', animationDuration: Math.random()*10+10+'s', animationDelay: `${Math.random()*5}s` }}
                                />
                            ))}
                        </div>
                    </div>

                    <div className="relative z-10 w-full max-w-6xl h-[94vh] sm:h-[92vh] max-h-[850px] mx-2 sm:mx-4 overflow-hidden flex flex-col transition-all duration-700 text-white text-center text-white text-center text-white text-center text-white text-center">
                        {view === 'start' && <StartScreen onStart={() => setView('map')} />}
                        {view === 'map' && (
                            <MapView 
                                levels={LEVELS} collectedIds={collectedIds} 
                                onSelect={(idx) => { setCurrentIdx(idx); setLives(3); setView('playing'); playBgm(LEVELS[idx].bgm); }} 
                                onOpenJournal={() => setView('journal')} 
                                onFinal={() => { 
                                    setView('dedication'); 
                                    playBgm('https://jamiejenjen0305.github.io/MED/8-1.mp3'); 
                                }} 
                                isDedicationDone={isDedicationDone} 
                            />
                        )}
                        {view === 'playing' && (
                            <GameEngine 
                                level={LEVELS[currentIdx]} lives={lives} setLives={setLives} 
                                onComplete={() => setCollectedIds(prev => Array.from(new Set([...prev, LEVELS[currentIdx].id])))} 
                                onBack={() => { if(bgmRef.current) bgmRef.current.pause(); window.speechSynthesis.cancel(); setView('map'); }} 
                                playEffect={playEffect}
                            />
                        )}
                        {view === 'journal' && <JournalView levels={LEVELS} collectedIds={collectedIds} onClose={() => setView('map')} isDedicationDone={isDedicationDone} />}
                        {view === 'dedication' && (
                            <DedicationScene 
                                onFinish={() => { setIsDedicationDone(true); setView('result'); }} 
                                onBack={() => { if(bgmRef.current) bgmRef.current.pause(); window.speechSynthesis.cancel(); setView('map'); }} 
                                playEffect={playEffect}
                            />
                        )}
                        {view === 'result' && <FinalResult levels={LEVELS} onRestart={() => setView('map')} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
