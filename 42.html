<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小沙彌修行日記 - 佛說四十二章經</title>
    <style>
        /* --- 字體與全域變數 --- */
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

        :root {
            /* 山水禪意配色 */
            --bg-overlay: rgba(255, 255, 255, 0.1);
            --wood-frame: rgba(62, 39, 35, 0.6);
            --wood-inner: rgba(141, 110, 99, 0.5);
            --paper-bg: rgba(255, 253, 231, 0.3);
            --btn-ink: #3E2723;
            --btn-text: #FFF;
            --text-dark: #212121;
            --highlight: rgba(255, 235, 59, 0.3);
            --btn-orange: #FF9800;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Noto Serif TC', 'Zen Maru Gothic', serif;
            background-color: #f0f0f0;
            color: var(--text-dark);
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
        }

        .screen::-webkit-scrollbar, #level-grid::-webkit-scrollbar, #scroll-area::-webkit-scrollbar { display: none; }
        .screen, #level-grid, #scroll-area { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        
        #bg-img {
            position: absolute; width: 100%; height: 100%; object-fit: cover;
            opacity: 0.8; transition: opacity 1s ease-in-out;
        }

        .cloud-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            z-index: 1; pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            width: 120px; height: 40px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: floatCloud linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        .cloud::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .cloud::before { width: 40px; height: 40px; top: -15px; left: 50px; }
        #cloud1 { top: 10%; left: -20%; transform: scale(1.5); animation-duration: 45s; }
        #cloud2 { top: 25%; left: -10%; transform: scale(1.2); animation-duration: 60s; animation-delay: -20s; opacity: 0.7; }

        @keyframes floatCloud { 0% { left: -200px; } 100% { left: 100%; } }

        #game-container {
            width: 100%; height: 100%; max-width: 500px;
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            border-left: 1px solid rgba(255,255,255,0.2); 
            border-right: 1px solid rgba(255,255,255,0.2);
            transition: all 0.5s;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s;
            opacity: 1; transform: scale(1); overflow-y: auto; overflow-x: hidden;
            background: transparent;
        }
        .screen.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; visibility: hidden; }

        #menu-screen { justify-content: center; }
        .title-box {
            background: rgba(255, 255, 255, 0.6); padding: 20px 40px; border-radius: 4px;
            border: 2px solid #5D4037; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px; text-align: center; position: relative;
        }
        
        /* 標題字體：宋體 */
        .title-main { 
            font-size: 3rem; 
            font-weight: 900; 
            color: #3E2723; 
            margin: 0; 
            letter-spacing: 5px; 
            font-family: 'Noto Serif TC', serif; 
        }
        .title-sub { font-size: 1.1rem; color: #5D4037; font-weight: bold; margin-top: 10px; border-top: 1px solid #8D6E63; display: inline-block; padding-top: 5px; }
        .monk-hero { width: 240px; height: 240px; margin: 10px auto; position: relative; opacity: 0.9; }
        .monk-hero img { width: 100%; height: 100%; object-fit: contain; filter: sepia(0.3) drop-shadow(0 10px 10px rgba(0,0,0,0.2)); animation: float 4s ease-in-out infinite; }
        
        /* 按鈕：位置往上調整 */
        .btn-start {
            background: rgba(62, 39, 35, 0.85); width: 200px; height: 70px;
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-size: 1.5rem; font-weight: 500; color: #fff; letter-spacing: 3px;
            cursor: pointer; 
            margin-top: -10px; /* 從 40px 改為 -10px，讓按鈕貼近小沙彌，整體上移 */
            margin-bottom: 50px; /* 增加底部邊距，確保離螢幕底端有距離 */
            transition: all 0.3s; 
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .btn-start:active { transform: scale(0.95); }

        #level-select-screen { padding-top: 80px; }
        .header-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
            display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1); z-index: 20;
            padding-left: 60px; /* 為左側的音樂按鈕留空間 */
        }
        .header-title { flex: 1; text-align: center; color: #3E2723; font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; }
        .btn-back {
            background: rgba(255,255,255,0.8); color: #3E2723; border: 1px solid #3E2723; 
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s;
            /* 確保按鈕有背景色，避免在複雜背景下看不見 */
        }
        .btn-back:hover { background: #3E2723; color: #fff; }

        #level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 25px; width: 100%; padding-bottom: 120px; }
        
        .level-node {
            aspect-ratio: 1.2; background: rgba(255,255,255,0.6); border-radius: 12px;
            border: 2px solid rgba(62,39,35,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; position: relative; backdrop-filter: blur(2px); padding: 5px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            animation: nodePopIn 0.5s backwards;
        }
        @keyframes nodePopIn { from { opacity: 0; transform: scale(0.5) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .level-node:hover { transform: translateY(-8px) scale(1.08); background: rgba(255,255,255,0.95); box-shadow: 0 15px 25px rgba(0,0,0,0.15); border-color: #8D6E63; z-index: 5; }
        .level-node:active { transform: scale(0.95); background: rgba(255,255,255,0.7); }
        .level-node.locked { opacity: 0.6; background: rgba(200, 200, 200, 0.3); border: 1px dashed #999; position: relative; transform: scale(0.95); filter: grayscale(80%); }
        .level-node.locked::after { content: '🔒'; font-size: 1.5rem; opacity: 0.5; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
        .level-node.locked span.lvl-num { display: block !important; opacity: 0.3; filter: blur(0.5px); color: #555; z-index: 0; }
        
        /* 1. 過關回復紅色圈圈處要有紅色小花(要大) */
        .level-node.completed { background: rgba(255,255,255,0.85); border-color: #D32F2F; box-shadow: 0 5px 15px rgba(211, 47, 47, 0.2); }
        .level-node.completed::after {
            content: '❀'; /* 實心花朵 */
            color: #D32F2F; /* 正紅色 */
            position: absolute; bottom: -8px; right: -8px; 
            font-size: 3rem; /* 大尺寸 */
            opacity: 1; z-index: 2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            /* 紅色圈圈背景 */
            width: 45px; height: 45px;
            background: #fff; border-radius: 50%; border: 2px solid #D32F2F;
            display: flex; justify-content: center; align-items: center;
            transform: rotate(-10deg);
        }
        
        .lvl-num { font-size: 1.1rem; font-weight: 900; color: #3E2723; font-family: 'Noto Serif TC', serif; }
        .lvl-name { font-size: 0.9rem; color: #5D4037; text-align: center; margin-top: 5px; font-weight: bold; }

        #game-screen { padding: 0; display: flex; flex-direction: column; background: transparent; }
        .game-top-bar {
            width: 100%; padding: 10px 20px 10px 60px; /* 左側留空 */
            background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.1); z-index: 30; flex-shrink: 0;
        }
        .level-tag { font-size: 1.1rem; font-weight: 900; color: #3E2723; letter-spacing: 1px; font-family: 'Noto Serif TC', serif; }
        .hearts-bar { display: flex; gap: 8px; margin: 0 10px; }
        .heart-life { font-size: 1.2rem; color: rgba(62,39,35,0.2); transition: transform 0.2s; }
        .heart-life.active { color: #C62828; transform: scale(1.1); text-shadow: 0 0 2px rgba(198,40,40,0.5); }
        
        .time-wrapper { width: 100%; height: 4px; background: rgba(0,0,0,0.1); flex-shrink: 0; }
        .time-fill { height: 100%; background: #5D4037; width: 100%; transition: width 0.2s linear; opacity: 0.8; }

        #scroll-area {
            flex: 1; width: 100%; display: flex; flex-direction: column; 
            overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 30px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
        }
        .board-container { width: 100%; margin: auto 0; background: transparent; padding: 10px 0; }
        
        #sutra-text { 
            font-size: 1.6rem; line-height: 1.6; color: #212121; font-weight: 600; text-align: center; white-space: pre-wrap; text-shadow: 0 0 1px rgba(255,255,255,0.5);
        }
        #sutra-text.reading-mode { text-align: justify; line-height: 1.8; color: #000; }

        .blank-space {
            display: inline-block; min-width: 70px; border-bottom: 2px solid #5D4037; 
            margin: 0 5px; vertical-align: baseline; color: transparent; transition: all 0.3s;
            text-align: center; padding: 0 5px; line-height: inherit;
        }
        .blank-space.target { background: rgba(255, 235, 59, 0.2); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .blank-space.filled { border-bottom-color: transparent; color: #bf360c; font-weight: 900; }

        #game-footer {
            width: 100%; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px);
            /* 修改：大幅增加底部內距 (padding-bottom)，將選項按鈕往上推 */
            padding: 20px 20px 120px 20px; 
            flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.3);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; z-index: 40;
        }
        .option-brick {
            background: rgba(255,255,255,0.9); color: #3E2723; border: 1px solid rgba(62,39,35,0.3); 
            border-radius: 4px; padding: 10px 20px; font-size: 1.2rem; font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.2s; min-width: 60px; font-family: 'Noto Serif TC', serif;
        }
        .option-brick:active { transform: translateY(2px); background: #fff; }
        .option-brick.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }

        #modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #modal-overlay.hidden { display: none !important; }
        .modal-box {
            background: #FAFAFA; width: 80%; max-width: 300px; padding: 40px 30px; border-radius: 8px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid #eee;
        }
        /* 這裡也一併套用標楷體 */
        .modal-title { font-size: 1.8rem; color: #3E2723; margin-bottom: 10px; font-family: 'Noto Serif TC', serif; }
        .modal-text { font-size: 1.1rem; color: #757575; margin-bottom: 30px; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .shake-anim { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* 修改：音樂按鈕移至左上角，避免擋住關閉按鈕 */
        #music-btn {
            position: absolute; top: 15px; left: 15px; width: 36px; height: 36px;
            background: rgba(255,255,255,0.6); border-radius: 50%; border: 1px solid rgba(255,255,255,0.8);
            font-size: 1.2rem; cursor: pointer; z-index: 50; 
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); color: #3E2723;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

<div class="bg-layer">
    <img id="bg-img" src="https://jamiejenjen0305.github.io/MED/42_1_1.png" alt="Background" onerror="this.src='https://placehold.co/1080x1920/e0e0e0/999?text=Home+Background&font=playfair'">
    <div class="cloud-container">
        <div class="cloud" id="cloud1"></div>
        <div class="cloud" id="cloud2"></div>
    </div>
</div>

<button id="music-btn" onclick="window.musicMgr.toggle()">🔊</button>

<div id="game-container">
    <div id="menu-screen" class="screen">
        <div class="title-box">
            <h1 class="title-main">小沙彌<br>修行日記</h1>
            <div class="title-sub">佛說四十二章經</div>
        </div>
        <div class="monk-hero">
            <img src="monk_home.png" alt="小沙彌" id="hero-img" onerror="this.src='https://jamiejenjen0305.github.io/MED/42_0_1.png'">
        </div>
        <button class="btn-start" onclick="window.game.goToLevelSelect()">開始修行</button>
    </div>

    <div id="level-select-screen" class="screen hidden">
        <div class="header-bar">
            <button class="btn-back" onclick="window.game.goToMenu()">❮</button>
            <div class="header-title">章節選擇</div>
            <div style="width: 40px;"></div>
        </div>
        <div id="level-grid"></div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-top-bar">
            <div class="level-tag" id="level-title">第一章</div>
            <div class="hearts-bar" id="hearts-display"></div>
            <!-- 確保關閉按鈕有背景 -->
            <button class="btn-back" style="background:rgba(255,255,255,0.6); font-size:1.2rem; border:1px solid #3E2723;" onclick="window.game.quitLevel()">✕</button>
        </div>
        <div class="time-wrapper"><div class="time-fill" id="time-bar"></div></div>
        <div id="scroll-area">
            <div class="board-container" id="board">
                <div id="sutra-text"></div>
            </div>
        </div>
        <div id="game-footer"></div>
    </div>

    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">標題</div>
            <div class="modal-text" id="modal-msg">內容</div>
            <button class="option-brick" style="background:#3E2723; color:white; width:100%; border:none;" id="modal-btn">確定</button>
        </div>
    </div>
</div>

<script>
    const themes = [
        { name: "初發心", img: "https://jamiejenjen0305.github.io/MED/42_1_1.png",  music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "入林",   img: "https://jamiejenjen0305.github.io/MED/42_1_2.png",  music: "https://jamiejenjen0305.github.io/MED/8-2.mp3" },
        { name: "涉水",   img: "https://jamiejenjen0305.github.io/MED/42_1_3.png",  music: "https://jamiejenjen0305.github.io/MED/8-3.mp3" },
        { name: "秋思",   img: "https://jamiejenjen0305.github.io/MED/42_1_4.png",  music: "https://jamiejenjen0305.github.io/MED/8-4.mp3" },
        { name: "寒冬",   img: "https://jamiejenjen0305.github.io/MED/42_1_5.png",  music: "https://jamiejenjen0305.github.io/MED/8-5.mp3" },
        { name: "星夜",   img: "https://jamiejenjen0305.github.io/MED/42_1_6.png",  music: "https://jamiejenjen0305.github.io/MED/8-6.mp3" },
        { name: "曙光",   img: "https://jamiejenjen0305.github.io/MED/42_1_7.png",  music: "https://jamiejenjen0305.github.io/MED/8-7.mp3" },
        { name: "晨鐘",   img: "https://jamiejenjen0305.github.io/MED/42_1_8.png",  music: "https://jamiejenjen0305.github.io/MED/8-8.mp3" },
        { name: "古寺",   img: "https://jamiejenjen0305.github.io/MED/42_1_9.png",  music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "雲海",   img: "https://jamiejenjen0305.github.io/MED/42_1_10.png", music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "竹林",   img: "https://jamiejenjen0305.github.io/MED/42_1_11.png", music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "落花",   img: "https://jamiejenjen0305.github.io/MED/42_1_12.png", music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "明月",   img: "https://jamiejenjen0305.github.io/MED/42_1_13.png", music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" },
        { name: "涅槃",   img: "https://jamiejenjen0305.github.io/MED/42_1_14.png", music: "https://jamiejenjen0305.github.io/MED/8-1.mp3" }
    ];

    class MusicGenerator {
        constructor() {
            this.bgm = new Audio();
            this.bgm.loop = true;
            this.isPlaying = true;
            this.currentTheme = -1;
            this.ctx = null;
        }
        init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        toggle() {
            if (this.isPlaying) this.stop();
            else { this.isPlaying = true; this.play(this.currentTheme !== -1 ? this.currentTheme : 0); }
        }
        play(themeIdx) {
            this.isPlaying = true;
            document.getElementById('music-btn').innerText = "🔊";
            if (this.currentTheme !== themeIdx) {
                 this.currentTheme = themeIdx;
                 const theme = themes[themeIdx % themes.length];
                 this.bgm.src = theme.music;
                 this.bgm.play().catch(e => console.log("需使用者互動才能播放音樂"));
            } else if (this.bgm.paused) {
                 this.bgm.play().catch(e => console.log("需使用者互動才能播放音樂"));
            }
        }
        stop() {
            this.isPlaying = false;
            document.getElementById('music-btn').innerText = "🔇";
            this.bgm.pause();
        }
        playEffect(type) {
            this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            const t = this.ctx.currentTime;
            if (type === 'correct') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, t); 
                gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, t); 
                gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, t); 
                gain.gain.setValueAtTime(0.02, t); gain.gain.linearRampToValueAtTime(0, t + 0.05);
                osc.start(t); osc.stop(t + 0.05);
            }
        }
    }
    
    const musicMgr = new MusicGenerator();
    window.musicMgr = musicMgr;

    const speakText = (text) => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let spokenText = text;
            spokenText = spokenText.replace(/佛為解說/g, "佛為味說");
            spokenText = spokenText.replace(/為/g, "維"); 
            spokenText = spokenText.replace(/度憍陳如/g, "度橋陳如");
            spokenText = spokenText.replace(/一上一還/g, "一上一環");
            spokenText = spokenText.replace(/降諸魔道/g, "祥諸魔道");
            spokenText = spokenText.replace(/四真道行/g, "四真道橫");
            spokenText = spokenText.replace(/難/g, "南");

    class Game {
        constructor() {
            try { 
                const stored = localStorage.getItem('monk_completed_levels');
                this.completedLevels = stored ? JSON.parse(stored) : [];
            } catch (e) { 
                this.completedLevels = []; 
            }
            
            this.currentLevel = 0; this.lives = 3; this.timer = null; this.puzzleState = {}; 
            this.chapterSegments = []; this.segIndex = 0;
            this.screens = {
                menu: document.getElementById('menu-screen'),
                levelSelect: document.getElementById('level-select-screen'),
                game: document.getElementById('game-screen')
            };
            this.modal = document.getElementById('modal-overlay');
            this.levelGrid = document.getElementById('level-grid');
        }

        switchScreen(name) {
            musicMgr.playEffect('click');
            Object.values(this.screens).forEach(s => s.classList.add('hidden'));
            this.screens[name].classList.remove('hidden');
        }

        goToMenu() { 
            // 回首頁時還原預設背景
            document.getElementById('bg-img').src = "https://jamiejenjen0305.github.io/MED/42_1_1.png";
            this.switchScreen('menu'); 
        }
        
        goToLevelSelect() { this.renderLevels(); this.switchScreen('levelSelect'); }

        applyTheme(themeIdx) {
            const theme = themes[themeIdx % themes.length];
            document.getElementById('bg-img').src = theme.img;
            if (musicMgr.isPlaying) musicMgr.play(themeIdx);
        }

        renderLevels() {
            this.levelGrid.innerHTML = '';
            sutraData.forEach((d, i) => {
                const btn = document.createElement('div');
                btn.className = 'level-node';
                
                // 修改：判斷該關卡是否在已完成清單中
                const isCompleted = this.completedLevels.includes(i);

                // 移除 locked 樣式，只保留 completed
                if (isCompleted) btn.classList.add('completed');
                
                const num = i === 0 ? '序' : i;
                const chapterTitle = d.title.split('：')[1] || d.title; // 取得冒號後的章節名
                const displayTitle = chapterTitle.length > 4 ? chapterTitle.substring(0,4) + "..." : chapterTitle;
                
                btn.innerHTML = `
                    <span class="lvl-num" style="font-size:1.4rem;">${num}</span>
                    <span class="lvl-name" style="font-size:0.9rem; font-weight:900;">${displayTitle}</span>
                `;
                
                btn.style.animationDelay = `${i * 0.05}s`;

                btn.onclick = () => {
                    // 2.回復過關後的關卡，直接秀出經文
                    if (isCompleted) {
                        this.showReview(i);
                    } else {
                        this.startLevel(i);
                    }
                };
                this.levelGrid.appendChild(btn);
            });
        }

        // 閱經模式 (顯示全文 + 重新修行按鈕)
        showReview(idx, autoPlay = false) {
            this.currentLevel = idx;
            this.applyTheme(idx);
            
            this.switchScreen('game');
            document.getElementById('level-title').innerText = sutraData[idx].title;
            
            // 複習模式隱藏愛心與時間條
            document.getElementById('hearts-display').style.visibility = 'hidden';
            document.querySelector('.time-wrapper').style.visibility = 'hidden';
            
            const rawText = sutraData[idx].text;
            const textElement = document.getElementById('sutra-text');
            textElement.innerText = rawText;
            textElement.className = 'reading-mode';
            
            textElement.onclick = () => {
                if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
                else speakText(rawText);
            };

            const footer = document.getElementById('game-footer');
            footer.innerHTML = '';
            
            const btnContainer = document.createElement('div');
            btnContainer.style.display = 'flex';
            btnContainer.style.gap = '10px';

            const btnReplay = document.createElement('button');
            btnReplay.className = 'option-brick';
            btnReplay.innerText = "↻ 重新修行";
            // 2. 按重新修行，就重新開始玩此關卡
            btnReplay.onclick = () => {
                window.speechSynthesis.cancel();
                this.startLevel(idx); // 關鍵：這裡會進入遊戲模式
            };
            btnContainer.appendChild(btnReplay);

            if (idx < sutraData.length - 1) { 
                 const btnNext = document.createElement('button');
                 btnNext.className = 'option-brick';
                 btnNext.innerText = "下一章 ➜";
                 btnNext.onclick = () => {
                     window.speechSynthesis.cancel();
                     // 修改：檢查下一章是否在已完成清單中
                     if (this.completedLevels.includes(idx + 1)) this.showReview(idx + 1, true);
                     else this.startLevel(idx + 1);
                 };
                 btnContainer.appendChild(btnNext);
            }

            footer.appendChild(btnContainer);

            if (autoPlay) speakText(rawText);
        }

        startLevel(idx) {
            this.currentLevel = idx; 
            this.applyTheme(idx);
            this.switchScreen('game');
            document.getElementById('level-title').innerText = sutraData[idx].title;
            
            // 遊戲模式顯示愛心與時間
            document.getElementById('hearts-display').style.visibility = 'visible';
            document.querySelector('.time-wrapper').style.visibility = 'visible';
            
            const textElement = document.getElementById('sutra-text');
            textElement.className = '';
            textElement.onclick = null;

            const rawText = sutraData[idx].text;
            this.chapterSegments = this.createSegments(rawText);
            this.segIndex = 0;
            this.loadSegment();
            if(musicMgr.isPlaying) musicMgr.play(idx);
        }

        createSegments(text) {
            const parts = text.split(/([：。？！])/).filter(s => s.trim() !== '');
            let segments = [];
            let current = "";
            for(let i=0; i<parts.length; i++) {
                current += parts[i];
                if (parts[i].match(/[：。？！]/) && current.length > 30) {
                    segments.push(current);
                    current = "";
                }
            }
            if(current.length > 0) segments.push(current);
            return segments;
        }

        loadSegment() {
            const segmentText = this.chapterSegments[this.segIndex];
            this.lives = 3; 
            this.renderHearts();
            this.generatePuzzle(segmentText);
            const timeLimit = 20 + segmentText.length * 1.0; 
            this.startTimer(timeLimit);
        }

        renderHearts() {
            let html = '';
            // 使用實心愛心(❤)和空心愛心(♡)來明確顯示血量
            for(let i=0; i<3; i++) {
                if (i < this.lives) {
                     html += `<span class="heart-life active">❤</span>`;
                } else {
                     html += `<span class="heart-life">♡</span>`;
                }
            }
            document.getElementById('hearts-display').innerHTML = html;
        }

        generatePuzzle(text) {
            // Split including punctuation but separating them
            const parts = text.split(/([，。：？、！；「」\s\n\r]+)/);
            let html = '';
            let answers = [];
            let options = [];
            
            // Helper to check candidate
            const isCandidate = (str) => {
                return !str.match(/[，。：？、！；「」\s\n\r]+/) && str.trim().length >= 1;
            };

            // First pass: Random generation
            parts.forEach(part => {
                if (!isCandidate(part)) {
                    const displayPart = part.replace(/\n/g, '<br>');
                    html += `<span>${displayPart}</span>`;
                } else {
                    // Logic: random pick, max 5 blanks
                    if (answers.length < 5 && part.length > 1 && Math.random() > 0.3) { 
                        const idx = answers.length;
                        html += `<div class="blank-space" id="slot-${idx}"></div>`;
                        answers.push(part);
                    } else {
                        html += `<span>${part}</span>`;
                    }
                }
            });

            // If no answers generated, force generate
            if (answers.length === 0) {
                html = '';
                answers = [];
                
                let candidateIndices = [];
                parts.forEach((part, index) => {
                    if (isCandidate(part)) candidateIndices.push(index);
                });

                let targetIndices = new Set();
                if (candidateIndices.length > 0) {
                    const count = Math.min(candidateIndices.length, 3);
                    const shuffled = candidateIndices.sort(() => 0.5 - Math.random());
                    for(let i=0; i<count; i++) targetIndices.add(shuffled[i]);
                } else {
                    // Extreme case: no text candidates. Auto-win.
                    setTimeout(() => this.segmentWin(), 500);
                    return;
                }

                // Rebuild HTML
                parts.forEach((part, index) => {
                    if (!isCandidate(part)) {
                        const displayPart = part.replace(/\n/g, '<br>');
                        html += `<span>${displayPart}</span>`;
                    } else {
                        if (targetIndices.has(index)) {
                            const idx = answers.length;
                            html += `<div class="blank-space" id="slot-${idx}"></div>`;
                            answers.push(part);
                        } else {
                            html += `<span>${part}</span>`;
                        }
                    }
                });
            }

            // Options are just the answers (shuffled)
            options = [...answers];
            options.sort(() => Math.random() - 0.5);

            document.getElementById('sutra-text').innerHTML = html;
            const footer = document.getElementById('game-footer');
            footer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-brick';
                btn.innerText = opt;
                btn.onclick = (e) => this.handleGuess(opt, e.target);
                footer.appendChild(btn);
            });

            this.puzzleState = { answers, currentIdx: 0 };
            this.highlightSlot(0);
        }

        highlightSlot(idx) {
            document.querySelectorAll('.blank-space').forEach(el => el.classList.remove('target'));
            const el = document.getElementById(`slot-${idx}`);
            if(el) el.classList.add('target');
        }

        handleGuess(word, btn) {
            const correctAns = this.puzzleState.answers[this.puzzleState.currentIdx];
            if (word === correctAns) {
                musicMgr.playEffect('correct');
                const slot = document.getElementById(`slot-${this.puzzleState.currentIdx}`);
                slot.innerText = word;
                slot.classList.remove('target');
                slot.classList.add('filled');
                btn.classList.add('hidden'); 
                this.puzzleState.currentIdx++;

                const visualBlanks = document.querySelectorAll('.blank-space:not(.filled)').length;
                if (this.puzzleState.currentIdx >= this.puzzleState.answers.length && visualBlanks === 0) {
                    this.segmentWin();
                } else {
                    this.highlightSlot(this.puzzleState.currentIdx);
                }
            } else {
                musicMgr.playEffect('wrong');
                this.lives--;
                this.renderHearts();
                document.getElementById('game-container').classList.add('shake-anim');
                setTimeout(() => document.getElementById('game-container').classList.remove('shake-anim'), 400);
                if (this.lives <= 0) this.levelFail("請靜心思考，再試一次。");
            }
        }

        startTimer(sec) {
            if (this.timer) clearInterval(this.timer);
            let total = sec; let remain = sec;
            const bar = document.getElementById('time-bar');
            bar.style.width = '100%';
            this.timer = setInterval(() => {
                remain -= 0.1;
                const pct = (remain / total) * 100;
                bar.style.width = pct + '%';
                if (pct < 30) bar.style.background = '#FF5252'; else bar.style.background = '#5D4037';
                if (remain <= 0) { clearInterval(this.timer); this.levelFail("時間到了，請再接再厲。"); }
            }, 100);
        }

        segmentWin() {
            clearInterval(this.timer);
            const board = document.getElementById('board');
            board.classList.add('success-anim');
            
            const tip = document.createElement('div');
            tip.id = 'success-tip'; 
            tip.innerText = "過關"; 
            // 放大蓋章圖式
            tip.style.cssText = `
                position: absolute; top: 50%; left: 50%; 
                transform: translate(-50%, -50%) rotate(-15deg) scale(0); 
                color: #D32F2F; font-size: 5rem; font-weight: 900; 
                border: 8px solid #D32F2F; padding: 15px 30px; border-radius: 10px; 
                background: rgba(255, 255, 255, 0.8); 
                box-shadow: 0 0 20px rgba(211, 47, 47, 0.5);
                z-index: 100; pointer-events: none;
                font-family: 'Noto Serif TC', cursive, serif;
                letter-spacing: 5px;
                animation: stampIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            `;
            board.appendChild(tip);
            
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes stampIn {
                    0% { transform: translate(-50%, -50%) rotate(-15deg) scale(2); opacity: 0; }
                    100% { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 1; }
                }
            `;
            document.head.appendChild(style);

            const cleanup = () => {
                const existingTip = document.getElementById('success-tip');
                if (existingTip) existingTip.remove();
                board.classList.remove('success-anim');
            };

            if (this.segIndex < this.chapterSegments.length - 1) {
                setTimeout(() => {
                    cleanup(); 
                    this.segIndex++;
                    this.loadSegment();
                }, 1500);
            } else {
                // 修改：記錄已完成的關卡到陣列
                if (!this.completedLevels.includes(this.currentLevel)) {
                    this.completedLevels.push(this.currentLevel);
                    try { 
                        localStorage.setItem('monk_completed_levels', JSON.stringify(this.completedLevels)); 
                    } catch(e) {}
                }
                
                const fullText = sutraData[this.currentLevel].text;
                speakText(fullText);

                setTimeout(() => {
                    cleanup(); 
                    // 自動進入閱經模式
                    this.showReview(this.currentLevel, false); 
                }, 1000);
            }
        }

        levelFail(reason) {
            clearInterval(this.timer);
            this.showModal("修行暫停", reason, "重新來過", () => this.loadSegment());
        }

        quitLevel() {
            clearInterval(this.timer);
            window.speechSynthesis.cancel();
            this.goToLevelSelect();
        }

        showModal(title, msg, btnTxt, cb) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            const btn = document.getElementById('modal-btn');
            btn.innerText = btnTxt;
            btn.onclick = () => {
                musicMgr.playEffect('click');
                this.modal.classList.add('hidden');
                if(cb) cb();
            };
            this.modal.classList.remove('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', () => { window.game = new Game(); });
</script>
